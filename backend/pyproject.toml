[project]
name = "backend"
version = "0.1.0"
description = "Restaurant Recommendation AI Platform - FastAPI + LangGraph + MCP backend"
readme = "README.md"
authors = [
    { name = "Santhosh", email = "ssantu.shiva@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "mcp[cli]>=2.1.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "tenacity>=9.1.4",
    "torch>=2.14.0",
    "transformers>=5.16.1",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
api = "backend.api.main:run"
backend-cli = "backend.cli.main:run"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
